<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <title>weather | app</title>
</head>
<body>
  <h1>Weather App</h1>

  <form id="weather-form">
    <input
      type="text"
      id="location"
      placeholder="Enter location..."
      required
    >
    <button type="submit">Get Weather</button>
  </form>

  <div id="weather-display">
    <p id="weather-placeholder">
      <i data-lucide="cloud-sun"></i>
      Search for a location to see the current weather.
    </p>
    <div id="weather-content" hidden>
      <h2 id="city"></h2>
      <div style="display: flex; align-items: center; justify-content: center;">
        <img id="weather-icon" src="" alt="Current weather condition">
        <p id="temperature"></p>
      </div>
      <p id="condition"></p>
      <p id="feels-like">
        <i data-lucide="thermometer"></i>
        <span></span>
      </p>
      <p id="humidity">
        <i data-lucide="droplets"></i>
        <span></span>
      </p>
      <p id="wind-speed">
        <i data-lucide="wind"></i>
        <span></span>
      </p>
      <div class="temperature-range">
        <p id="high-low">
          <i data-lucide="thermometer-sun"></i>
          <span></span>
        </p>
      </div>

      <div id="temperature-toggle">
        <button id="celsius-btn" type="button">°C</button>
        <button id="fahrenheit-btn" type="button">°F</button>
      </div>
    </div>

    <p id="loading-message" hidden>
      Fetching weather data...
    </p>

    <p id="error-message" hidden></p>
  </div>
  
  <script src="scripts.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
