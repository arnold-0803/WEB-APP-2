<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>weather | app</title>
</head>
<body>
  <h1>Weather App</h1>

  <form id="weather-form">
    <input
      type="text"
      id="location"
      placeholder="Enter a city..."
      required
    >
    <button type="submit">Get Weather</button>
  </form>

  <div id="weather-display">
    <h2 id="city"></h2>
    <div style="display: flex; align-items: center; justify-content: center;">
      <img id="weather-icon" src="" alt="Current weather condition">
      <p id="temperature"></p>
    </div>
    <p id="condition"></p>
    <p id="feels-like"></p>
    <p id="humidity"></p>
    <p id="wind-speed"></p>
    <p id="high-low"></p>

    <div id="temperature-toggle">
      <button id="celsius-btn" type="button">°C</button>
      <button id="fahrenheit-btn" type="button">°F</button>
    </div>
  </div>

  <p id="loading-message" hidden>
    Fetching weather data...
  </p>

  <p id="error-message" hidden></p>
  
  <script src="scripts.js"></script>
</body>
</html>
